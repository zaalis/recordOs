[package]
name = "vision-pro"
version = "0.1.4"
description = "Record OS Windows desktop agent"
edition = "2021"
license = "Proprietary"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2.3.4"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
vp-agent = { path = "../../../agent/crates/vp-agent" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
