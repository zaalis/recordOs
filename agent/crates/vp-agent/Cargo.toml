[package]
name = "vp-agent"
description = "Vision-Pro Windows agent core: security, pairing, signaling, capture, encoding, WebRTC and input."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "vp-agentd"
path = "src/bin/vp-agentd.rs"

[features]
default = []
# Embed the built iPad web app (apps/ipad/dist) into the binary.
embed-web = []

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1", "json", "query"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "0.3"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
subtle = "2"
base64 = "0.22"
str0m = { version = "0.23.1", default-features = false, features = ["rust-crypto"] }
mdns-sd = "0.13"
if-addrs = "0.13"
gethostname = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
png = "0.17"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
rust-embed = { version = "8", features = ["include-exclude"] }
openh264 = "0.9"

[dev-dependencies]
vp-relay = { path = "../vp-relay" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_Networking_NetworkListManager",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
